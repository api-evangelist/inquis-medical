aid: inquis-medical
name: Inquis Medical
description: 'Inquis Medical is a privately funded medical device company founded in 2020
  and headquartered at 1530 O''Brien Drive in Menlo Park, California, dedicated to advancing
  the treatment of venous thromboembolic disease (VTE). Its flagship product, the AVENTUS
  Precision Thrombectomy System, is a single-catheter mechanical thrombectomy platform that
  combines a directional intelligent tip with an integrated 5F navigation catheter and dilator,
  TrueClot proprietary tissue-sensing that gives the operator real-time feedback on what the
  catheter tip is engaging (wall latch, lollipops, clogs), and in-line filtration with autologous
  blood reinfusion that reduces blood loss without capital equipment. The AVENTUS Thrombectomy
  System received FDA 510(k) clearance for peripheral indications and, in June 2025, for the
  treatment of pulmonary embolism; the company also ships the AVENTUS Introducer Sheath and the
  AVENTUS Clot Management System. Inquis raised a $40 million Series B in 2024 and a $75 million
  Series C to scale commercial adoption. Inquis Medical is a clinical hardware company: it
  publishes no public developer program, API documentation, SDK, or machine-readable API contract,
  and its public GitHub organization holds a single empty embedded-firmware repository.'
